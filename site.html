<!DOCTYPE html>

<html data-theme="cyberpunk" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contato | Minha Empresa</title>
<!-- DaisyUI -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
<!-- Tailwind CSS -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
        body {
            background:
                radial-gradient(
                    circle at top,
                    rgba(139, 0, 0, 0.35),
                    transparent 40%
                ),
                #080808;
        }

        .form-container {
            box-shadow:
                0 0 30px rgba(255, 0, 60, 0.15),
                0 0 80px rgba(139, 0, 0, 0.10);
        }

        .logo {
            filter:
                drop-shadow(0 0 12px rgba(255, 0, 60, 0.6));
        }
    </style>
</head>
<body class="min-h-screen text-white">
<!-- CABEÇALHO -->
<header class="border-b border-red-900/40 bg-black/70 backdrop-blur-md">
<div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-5">
<div>
<h1 class="text-xl font-bold tracking-widest text-red-500">
                    MINHA EMPRESA
                </h1>
<p class="text-xs text-gray-400">
                    Atendimento profissional
                </p>
</div>
<a class="hidden text-sm text-green-400 hover:text-green-300 sm:block" href="https://wa.me/5521999999999?text=Olá,%20vim%20pelo%20site%20e%20gostaria%20de%20um%20atendimento.">Fale conosco no WhatsApp</a>
</div>
</header>
<!-- ÁREA PRINCIPAL -->
<main class="flex min-h-[calc(100vh-90px)] items-center justify-center px-4 py-12">
<section class="w-full max-w-3xl">
<!-- LOGO / FOTO -->
<div class="mb-8 flex justify-center">
<!--
                    TROQUE "logo.png" PELO CAMINHO DA SUA FOTO/LOGO
                    Exemplo:
                    src="imagens/logo-empresa.png"
                -->
<img alt="Logo da empresa" class="logo h-32 w-32 rounded-full border-4 border-red-700 bg-black object-cover p-2 sm:h-40 sm:w-40" src="Nago.png"/>
</div>
<!-- TÍTULO -->
<div class="mb-8 text-center">
<h2 class="text-3xl font-bold tracking-wide text-white sm:text-4xl">
                    Entre em contato
                </h2>
<p class="mt-3 text-gray-400">
                    Preencha o formulário abaixo e nossa equipe entrará em contato.
                </p>
</div>
<!-- FORMULÁRIO -->
<div class="form-container rounded-2xl border border-red-900/50 bg-zinc-950/95 p-6 sm:p-10">
<form action="https://formsubmit.co/jrnatakarl@gmail.com" method="POST"><input name="_autoresponse" type="hidden" value="Recebemos sua mensagem e retornaremos em breve."/><input name="_captcha" type="hidden" value="false"/>
<!-- CONFIGURAÇÕES DO FORM SUBMIT -->
<input name="_subject" type="hidden" value="Novo contato recebido pelo site"/>
<input name="_template" type="hidden" value="table"/>
<!--
                        Depois de criar uma página de agradecimento,
                        você pode colocar a URL dela aqui.
                    -->
<!--
                    <input
                        type="hidden"
                        name="_next"
                        value="https://seusite.com/obrigado.html"
                    >
                    -->
<!-- Campo anti-spam -->
<input autocomplete="off" name="_honey" style="display:none" tabindex="-1" type="text"/>
<!-- NOME -->
<div class="mb-6">
<label class="mb-2 block text-sm font-semibold text-gray-200" for="nome">
                            Nome completo *
                        </label>
<input autocomplete="name" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white placeholder-gray-500 outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="nome" name="nome" placeholder="Digite seu nome completo" required="" type="text"/>
</div>
<!-- TELEFONE E EMAIL -->
<div class="grid grid-cols-1 gap-6 md:grid-cols-2">
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="telefone">
                                Telefone *
                            </label>
<input autocomplete="tel" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white placeholder-gray-500 outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="telefone" name="telefone" placeholder="(21) 99999-9999" required="" type="tel"/>
</div>
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="email">
                                E-mail *
                            </label>
<input autocomplete="email" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white placeholder-gray-500 outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="email" name="email" placeholder="seuemail@exemplo.com" required="" type="email"/>
</div>
</div>
<!-- EMPRESA E ASSUNTO -->
<div class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2">
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="empresa">
                                Empresa
                            </label>
<input autocomplete="organization" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white placeholder-gray-500 outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="empresa" name="empresa" placeholder="Nome da empresa" type="text"/>
</div>
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="assunto">
                                Assunto *
                            </label>
<select class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="assunto" name="assunto" required="">
<option value="">
                                    Selecione uma opção
                                </option>
<option value="Orçamento">
                                    Orçamento
                                </option>
<option value="Informações">
                                    Informações
                                </option>
<option value="Suporte">
                                    Suporte
                                </option>
<option value="Parceria">
                                    Parceria
                                </option>
<option value="Outro">
                                    Outro
                                </option>
</select>
</div>
</div>
<!-- DATA E HORÁRIO -->
<div class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2">
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="data">
                                Melhor data para contato
                            </label>
<input class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="data" name="data" type="date"/>
</div>
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="horario">
                                Melhor horário
                            </label>
<input class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="horario" name="horario" type="time"/>
</div>
</div>
<!-- ENDEREÇO -->
<div class="mt-8">
<h3 class="mb-4 text-lg font-bold text-red-500">
                            Informações de endereço
                        </h3>
<div class="grid grid-cols-1 gap-6 md:grid-cols-2">
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="endereco">
                                    Endereço
                                </label>
<input autocomplete="street-address" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white placeholder-gray-500 outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="endereco" name="endereco" placeholder="Rua, avenida, número..." type="text"/>
</div>
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="cidade">
                                    Cidade
                                </label>
<input autocomplete="address-level2" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white placeholder-gray-500 outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="cidade" name="cidade" placeholder="Sua cidade" type="text"/>
</div>
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="estado">
                                    Estado
                                </label>
<input autocomplete="address-level1" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white placeholder-gray-500 outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="estado" name="estado" placeholder="Ex.: RJ" type="text"/>
</div>
<div>
<label class="mb-2 block text-sm font-semibold text-gray-200" for="cep">
                                    CEP
                                </label>
<input autocomplete="postal-code" class="w-full rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white placeholder-gray-500 outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="cep" name="cep" placeholder="00000-000" type="text"/>
</div>
</div>
</div>
<!-- MENSAGEM -->
<div class="mt-6">
<label class="mb-2 block text-sm font-semibold text-gray-200" for="mensagem">
                            Mensagem *
                        </label>
<textarea class="w-full resize-none rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-white placeholder-gray-500 outline-none transition focus:border-red-600 focus:ring-2 focus:ring-red-600/20" id="mensagem" name="mensagem" placeholder="Digite aqui sua mensagem..." required="" rows="6"></textarea>
</div>
<!-- CONSENTIMENTO -->
<div class="mt-6 flex items-start gap-3">
<input class="mt-1 h-4 w-4 accent-red-600" id="consentimento" name="consentimento" required="" type="checkbox" value="Aceito"/>
<label class="text-sm leading-5 text-gray-400" for="consentimento">
                            Autorizo o uso das informações fornecidas para que
                            a empresa possa entrar em contato comigo.
                        </label>
</div>
<!-- BOTÃO -->
<div class="mt-8">
<button class="w-full rounded-lg bg-red-700 px-8 py-4 font-bold uppercase tracking-wider text-white transition hover:bg-red-600 hover:shadow-[0_0_25px_rgba(220,38,38,0.35)] active:scale-[0.99]" type="submit">
                            Enviar formulário
                        </button>
</div>
</form>
</div>
<!-- RODAPÉ -->
<div class="mt-8 text-center">
<p class="text-sm text-gray-500">
                    © 2026 Minha Empresa. Todos os direitos reservados.
                </p>
</div>
</section>
</main>
</body>
</html>
